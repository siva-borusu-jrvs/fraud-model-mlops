# One-time environment setup: creates Lakehouse Quality Monitor on the
# drift table, which provisions the _profile_metrics and _drift_metrics
# output tables and the profile computation notebook automatically.
#
# Run once per environment after initial data is loaded:
#   databricks bundle run monitoring_setup --target <target>
#
# The monitor's own daily schedule (08:00 ET) handles ongoing refreshes.
# Re-run this job if monitor configuration changes.
# Source: Git — checkout ${var.git_branch} at runtime.
resources:
  jobs:
    monitoring_setup:
      name: "[${bundle.target}] Fraud Model Monitoring Setup"

      git_source:
        git_url: https://github.com/siva-borusu-jrvs/fraud-model-mlops.git
        git_provider: gitHub
        git_branch: ${var.git_branch}

      tasks:
        - task_key: create_monitor
          notebook_task:
            notebook_path: src/monitoring/drift.py
            source: GIT
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: ${var.model_name}

      # No schedule - this is a manual, on-demand job

      email_notifications:
        on_failure:
          - ${var.notify_email}
