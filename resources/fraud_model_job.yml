# Retraining pipeline — runs AFTER a champion model is already registered.
# Initial model development is interactive (use notebooks/eda + src/models/train).
# This job retrains on fresh data, evaluates against the sitting champion,
# auto-promotes if better, and redeploys the endpoint.
resources:
  jobs:
    fraud_model_retrain:
      name: "[${bundle.target}] Fraud Model Retrain"
      tasks:
        - task_key: ingest
          notebook_task:
            notebook_path: ../src/data/ingestion.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: features
          depends_on:
            - task_key: ingest
          notebook_task:
            notebook_path: ../src/data/features.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: train
          depends_on:
            - task_key: features
          notebook_task:
            notebook_path: ../src/models/train.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: ${var.model_name}

        - task_key: evaluate
          depends_on:
            - task_key: train
          notebook_task:
            notebook_path: ../src/models/evaluate.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: ${var.model_name}

        - task_key: deploy
          depends_on:
            - task_key: evaluate
          notebook_task:
            notebook_path: ../src/serving/deploy.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
              model_name: ${var.model_name}
              endpoint_name: ${var.endpoint_name}

      email_notifications:
        on_failure:
          - siva.borusu@jrvs.ca

      permissions:
        - level: CAN_MANAGE
          user_name: siva.borusu@jrvs.ca
